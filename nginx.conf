events {
    worker_connections 1024;
}

http {
    # Uploads go browser → R2 directly; only render control JSON passes through here
    client_max_body_size 10M;

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    upstream fastapi {
        server fastapi:3000;
    }

    # Локальный HTTP сервер (без SSL)
    server {
        listen 80;
        server_name localhost;

        # trykimu.com/backend/* → http://fastapi/*
        location /backend/ {
            rewrite ^/backend/(.*)$ /$1 break;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_request_buffering off;
        }

        # trykimu.com/renderer/* → http://backend/*
        location /renderer/ {
            rewrite ^/renderer/(.*)$ /$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_request_buffering off;
        }

        # trykimu.com → http://frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}